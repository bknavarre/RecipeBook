    function getWeekKey(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset * 7);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      const y = monday.getFullYear();
      const m = String(monday.getMonth() + 1).padStart(2, "0");
      const dd = String(monday.getDate()).padStart(2, "0");
      return `${y}-${m}-${dd}`;
    }

    function compressImage(file, maxSize = 800, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const AISLE_KEYWORDS = [
      ["Meat & Seafood", /chicken|beef|pork|turkey|salmon|shrimp|fish|bacon|sausage|steak|ham|tuna|cod|tilapia|ground (beef|turkey|pork|chicken)/],
      ["Dairy & Eggs", /milk|cheese|butter|cream|yogurt|egg(s)?\b|sour cream|parmesan|mozzarella|cheddar/],
      ["Produce", /onion|garlic|tomato|pepper(s)?\b|lettuce|spinach|broccoli|carrot|celery|potato|lemon|lime|apple|banana|berr|herb|cilantro|parsley|basil|ginger|avocado|mushroom|zucchini|cucumber|asparagus|kale|cabbage|scallion/],

    ];
    function guessAisle(name, fallback = "Other") {
      const n = (name || "").toLowerCase();
      if (/frozen/.test(n)) return "Frozen";
      if (/black pepper|peppercorn|powder|dried|\bsalt\b|extract/.test(n)) return "Spices & Baking";
      for (const [aisle, re] of AISLE_KEYWORDS) if (re.test(n)) return aisle;
      return fallback;
    }

    const UNICODE_FRAC = { "½": .5, "⅓": 1/3, "⅔": 2/3, "¼": .25, "¾": .75, "⅛": .125, "⅜": .375, "⅝": .625, "⅞": .875 };
    const UNITS = ["cups","cup","c","tablespoons","tablespoon","tbsp","tbs","tbl","teaspoons","teaspoon","tsp","pounds","pound","lbs","lb","ounces","ounce","oz","grams","gram","g","kilograms","kg","ml","milliliters","liters","l","cloves","clove","cans","can","packages","package","pkg","slices","slice","pinch","dash","bunch","stalks","stalk","large","medium","small","quarts","quart","qt","pints","pint","pt","sticks","stick"];
    function parseIngredientLine(line) {
      let text = String(line || "").replace(/\s+/g, " ").trim();
      Object.entries(UNICODE_FRAC).forEach(([k, v]) => { text = text.replace(new RegExp("(\\d)?\\s*" + k), (_, w) => " " + ((w ? Number(w) : 0) + v) + " "); });
      text = text.trim();
      const m = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)(?:\s*-\s*[\d./]+)?\s+(.*)$/);
      if (!m) return { name: text, amount: 1, unit: "", aisle: guessAisle(text) };
      const toNum = (q) => q.split(/\s+/).reduce((sum, part) => {
        if (part.includes("/")) { const [a, b] = part.split("/").map(Number); return sum + (b ? a / b : 0); }
        return sum + Number(part);
      }, 0);
      const amount = +toNum(m[1]).toFixed(2) || 1;
      let rest = m[2].replace(/^\(.*?\)\s*/, "");
      const firstWord = (rest.split(" ")[0] || "").toLowerCase().replace(/\.$/, "");
      let unit = "";
      if (UNITS.includes(firstWord)) { unit = firstWord; rest = rest.split(" ").slice(1).join(" "); }
      rest = rest.replace(/^of\s+/i, "").trim();
      return { name: rest || text, amount, unit, aisle: /^cans?$/.test(unit) ? "Pantry / Canned" : guessAisle(rest) };
    }

    function splitSteps(text) {
      const clean = String(text || "").split(/\n/).filter(l => !/^\s*(source|notes?):/i.test(l)).join("\n").trim();
      let parts = clean.split(/\n+/).map(s => s.replace(/^\s*(step\s*)?\d+\s*[.):-]\s*/i, "").trim()).filter(Boolean);
      if (parts.length === 1 && parts[0].length > 100) parts = parts[0].split(/(?<=[.!?])\s+(?=[A-Z])/).map(s => s.trim()).filter(Boolean);
      return parts.length ? parts : ["No instructions yet. Tap Edit on the recipe to add them."];
    }

    function CookingMode({ recipe, onClose }) {
      const steps = useMemo(() => splitSteps(recipe.instructions), [recipe.instructions]);
      const [i, setI] = useState(0);
      const [drag, setDrag] = useState(0);
      const [awake, setAwake] = useState(null);
      const startX = useRef(null);
      const startY = useRef(null);
      useEffect(() => {
        let lock = null;
        const request = async () => {
          try {
            if ("wakeLock" in navigator) { lock = await navigator.wakeLock.request("screen"); setAwake(true); }
            else setAwake(false);
          } catch { setAwake(false); }
        };
        request();
        const onVis = () => { if (document.visibilityState === "visible") request(); };
        document.addEventListener("visibilitychange", onVis);
        document.body.style.overflow = "hidden";
        try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
        return () => {
          document.removeEventListener("visibilitychange", onVis);
          if (lock) lock.release().catch(() => {});
          document.body.style.overflow = "";
          try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch {}
        };
      }, []);
      const go = (n) => setI(x => Math.max(0, Math.min(steps.length - 1, x + n)));
      useEffect(() => {
        const onKey = (e) => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [steps.length]);
      const onTouchStart = (e) => { startX.current = e.touches[0].clientX; startY.current = e.touches[0].clientY; };
      const onTouchMove = (e) => {
        if (startX.current == null) return;
        const dx = e.touches[0].clientX - startX.current;
        const dy = e.touches[0].clientY - startY.current;
        if (Math.abs(dx) > Math.abs(dy)) setDrag(dx);
      };
      const onTouchEnd = () => { if (drag < -60) go(1); else if (drag > 60) go(-1); setDrag(0); startX.current = null; };
      return (
        <div className="fixed inset-0 z-[80] bg-cream-50 flex flex-col select-none">
          <div className="flex items-center justify-between px-5 pt-5 pb-2 gap-3">
            <div className="min-w-0">
              <p className="text-sm text-cocoa-500 truncate">{recipe.title}</p>
              <p className={`text-xs ${awake ? "text-emerald-700" : "text-stone-400"}`}>{awake ? "☀ Screen will stay on" : awake === false ? "Screen-on not supported in this browser" : ""}</p>
            </div>
            <button onClick={onClose} className="w-11 h-11 rounded-full bg-white shadow text-xl flex-shrink-0" aria-label="Close cooking mode">✕</button>
          </div>
          <div className="flex-1 overflow-hidden" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
            <div className="h-full flex" style={{ width: `${steps.length * 100}%`, transform: `translateX(calc(${-i * (100 / steps.length)}% + ${drag}px))`, transition: drag ? "none" : "transform 280ms ease" }}>
              {steps.map((step, idx) => (
                <div key={idx} className="h-full overflow-y-auto px-6 pb-6" style={{ width: `${100 / steps.length}%` }}>
                  <div className="flex items-end gap-2 mt-2 mb-5">
                    <span className="text-lg font-semibold text-cocoa-500 mb-3">Step</span>
                    <span className="font-display font-bold text-cocoa-700 leading-none" style={{ fontSize: "6rem" }}>{idx + 1}</span>
                    <span className="text-base text-stone-400 mb-3">of {steps.length}</span>
                  </div>
                  <p className="text-stone-800 font-medium" style={{ fontSize: "1.9rem", lineHeight: 1.35 }}>{step}</p>
                </div>
              ))}
            </div>
          </div>
          <div className="px-5 pb-7 pt-3">
            <div className="flex justify-center gap-1.5 mb-4">
              {steps.map((_, idx) => <button key={idx} onClick={() => setI(idx)} className={`h-2.5 rounded-full transition-all ${idx === i ? "w-6 bg-cocoa-600" : "w-2.5 bg-cocoa-200"}`} aria-label={`Go to step ${idx + 1}`} />)}
            </div>
            <div className="flex gap-3">
              <button onClick={() => go(-1)} disabled={i === 0} className="flex-1 py-4 rounded-2xl bg-white border text-lg font-semibold disabled:opacity-30">‹ Back</button>

      for (const r of res) if (r.status === "fulfilled" && r.value.ok) { try { add((await r.value.json()).meals); } catch {} }
      return [...out.values()];
    }
    async function mealDbToRecipe(id) {
      const r = await fetchWithTimeout(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`, {}, 12000);
      const m = (await r.json()).meals?.[0];
      if (!m) throw new Error("Recipe not found");
      const ings = [];
      for (let i = 1; i <= 20; i++) { const name = (m["strIngredient" + i] || "").trim(); if (name) ings.push(parseIngredientLine(`${(m["strMeasure" + i] || "").trim()} ${name}`.trim())); }
      const steps = String(m.strInstructions || "").split(/\r?\n+/).map(s => s.replace(/^\s*(step\s*)?\d+\s*[.):-]?\s*$/i, "").replace(/^\s*(step\s*)?\d+\s*[.):-]\s*/i, "").trim()).filter(s => s.length > 2);
      const src = m.strSource || `https://www.themealdb.com/meal/${id}`;
      const cat = { Breakfast: "Breakfast", Dessert: "Dessert", Starter: "Snack", Side: "Lunch" }[m.strCategory] || "Dinner";
      return { title: m.strMeal, category: cat, dietTags: m.strCategory === "Vegetarian" || m.strCategory === "Vegan" ? [m.strCategory] : [], baseServings: 4, nutrition: { calories: 400, protein: 25, carbs: 30, fat: 15, fiber: 5 }, ingredients: ings.length ? ings : [{ name: "Ingredient (edit)", amount: 1, unit: "", aisle: "Other" }], instructions: steps.map((s, i) => `${i + 1}. ${s}`).join("\n") + "\n\nSource: " + src, image: m.strMealThumb, url: src };
    }
    async function searchWebRecipes(query) {
      const html = await fetchPageHtml("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query + " recipe"));
      const results = [];
      const snippets = [...html.matchAll(/class="result__snippet"[^>]*>([\s\S]*?)<\/a>/gi)].map(m => decodeHtml(m[1]));
      [...html.matchAll(/<a[^>]+class="result__a"[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi)].forEach((m, i) => {
        let href = m[1].replace(/&amp;/g, "&");
        const uddg = href.match(/[?&]uddg=([^&]+)/);
        if (uddg) href = decodeURIComponent(uddg[1]);
        if (href.startsWith("//")) href = "https:" + href;
        if (!/^https?:/.test(href) || /duckduckgo\.com\/y\.js|ad_provider|bing\.com\/aclick/.test(href)) return;
        let site = ""; try { site = new URL(href).hostname.replace(/^www\./, ""); } catch {}
        if (results.length < 10) results.push({ kind: "web", title: decodeHtml(m[2]), url: href, snippet: snippets[i] || "", site });
      });
      return results;
    }

    let fbPromise = null;
    let signupInProgress = false;
    function initFirebase() {
      if (!FIREBASE_CONFIG) return Promise.reject(new Error("Accounts aren't set up in this copy of the app."));
      if (fbPromise) return fbPromise;
      fbPromise = (async () => {
        let lastErr;
        for (const base of FB_SOURCES) {
          try {
            await loadScriptOnce(base + "firebase-app-compat.js");
            await loadScriptOnce(base + "firebase-auth-compat.js");
            await loadScriptOnce(base + "firebase-firestore-compat.js");
            lastErr = null; break;
          } catch (e) { lastErr = e; }
        }
        if (lastErr || !window.firebase) throw new Error("Couldn't reach the sign-in service. Check your internet connection.");
        const firebase = window.firebase;
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
        const db = app.firestore();
        try { db.settings({ ignoreUndefinedProperties: true, merge: true }); } catch {}
        return { firebase, auth: app.auth(), db };
      })();
      fbPromise.catch(() => { fbPromise = null; });
      return fbPromise;
    }
    const USERNAME_RE = /^[a-z0-9_.]{3,20}$/;
    function friendlyAuthError(e) {
      const c = e?.code || "";
      const map = {
        "auth/email-already-in-use": "There's already an account with that email. Try logging in instead.",
        "auth/invalid-email": "That email address doesn't look right.",
        "auth/weak-password": "Please choose a stronger password (at least 8 characters).",
        "auth/wrong-password": "Wrong password. Try again or tap “Forgot password?”.",
        "auth/invalid-credential": "Wrong username/email or password.",
        "auth/invalid-login-credentials": "Wrong username/email or password.",
        "auth/user-not-found": "No account found with that email.",
        "auth/too-many-requests": "Too many tries. Please wait a few minutes and try again.",
        "auth/network-request-failed": "Network problem - check your internet connection.",
        "auth/operation-not-allowed": "Email sign-in isn't turned on yet (Firebase → Authentication → Sign-in method → Email/Password).",
        "permission-denied": "The database blocked this. Make sure the security rules from SETUP.md are published."
      };
      return map[c] || e?.message || "Something went wrong. Please try again.";
    }
    async function emailForLogin(id) {
      const v = String(id || "").trim();
      if (v.includes("@")) return v;
      const { db } = await initFirebase();
      const snap = await db.collection("usernames").doc(v.toLowerCase()).get();
      if (!snap.exists) throw new Error("No account with that username.");
      return snap.data().email;
    }
    async function accountSignUp({ username, email, password }) {
      const u = String(username || "").trim().toLowerCase();
      if (!USERNAME_RE.test(u)) throw new Error("Usernames are 3-20 characters: letters, numbers, _ or .");
      if (String(password || "").length < 8) throw new Error("Passwords need at least 8 characters.");
      const { auth, db, firebase } = await initFirebase();
      if ((await db.collection("usernames").doc(u).get()).exists) throw new Error("That username is taken. Please pick another.");
      signupInProgress = true;
      try {
        const cred = await auth.createUserWithEmailAndPassword(String(email).trim(), password);
        const uidNow = cred.user.uid;
        try {
          await db.runTransaction(async (tx) => {
            const ref = db.collection("usernames").doc(u);
            if ((await tx.get(ref)).exists) throw new Error("taken");
            tx.set(ref, { uid: uidNow, email: String(email).trim().toLowerCase() });
            tx.set(db.collection("users").doc(uidNow), { username: u, email: String(email).trim().toLowerCase(), plan: "trial", trialStarted: firebase.firestore.FieldValue.serverTimestamp(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          });
        } catch (e) {
          await cred.user.delete().catch(() => {});
          throw e.message === "taken" ? new Error("That username was just taken. Please pick another.") : e;
        }
        return cred.user;
      } finally { signupInProgress = false; }
    }
    async function accountLogIn({ id, password }) {
      const { auth } = await initFirebase();
      await auth.signInWithEmailAndPassword(await emailForLogin(id), password);

    async function accountReset(id) {

    async function cloudLoad(uidNow) {
      const { db } = await initFirebase();
      const userRef = db.collection("users").doc(uidNow);
      const [profileSnap, stateSnap, recipeSnap] = await Promise.all([userRef.get(), userRef.collection("data").doc("state").get(), userRef.collection("recipes").get()]);
      const recipes = [];
      recipeSnap.forEach(d => { try { recipes.push(JSON.parse(d.data().json)); } catch {} });
      return { profile: profileSnap.exists ? profileSnap.data() : null, stateJson: stateSnap.exists ? stateSnap.data().json : "", recipes };
    }

    async function cloudWriteRecipes(uidNow, ops) {
      const { db } = await initFirebase();
      const col = db.collection("users").doc(uidNow).collection("recipes");
      for (let i = 0; i < ops.length; i += 400) {

              <div>
                <div className="flex justify-between items-center mb-2"><h3 className="font-medium text-sm">Ingredients</h3><button type="button" onClick={addIng} className="text-xs text-cocoa-600">+ Add</button></div>
                <div className="space-y-2">
                  {form.ingredients.map((ing, idx) => (
                    <div key={idx} className="flex gap-1.5 items-center">
                      <input value={ing.name} onChange={e => updateIng(idx, "name", e.target.value)} placeholder="Name" className="flex-1 px-2 py-1.5 rounded-lg border text-sm" />
                      <input type="number" value={ing.amount} onChange={e => updateIng(idx, "amount", Number(e.target.value))} className="w-14 px-1 py-1.5 rounded-lg border text-sm" />
                      <input value={ing.unit} onChange={e => updateIng(idx, "unit", e.target.value)} placeholder="unit" className="w-14 px-1 py-1.5 rounded-lg border text-sm" />
                      <select value={ing.aisle} onChange={e => updateIng(idx, "aisle", e.target.value)} className="w-24 px-1 py-1.5 rounded-lg border text-xs">
                        {Object.keys(defaultAisles).map(a => <option key={a}>{a}</option>)}
                      </select>
                      <button type="button" onClick={() => removeIng(idx)} className="text-stone-400 text-sm">×</button>
                    </div>
                  ))}
                </div>
              </div>
              <textarea value={form.instructions} onChange={e => setForm({ ...form, instructions: e.target.value })} placeholder="Instructions..." rows={5} className="w-full px-3 py-2 rounded-2xl border border-cocoa-100 text-sm" />
              {form.image && <img src={form.image} alt="preview" className="w-full h-40 object-cover rounded-2xl" />}
            </div>
            <div className="p-4 border-t">
              <button onClick={() => { if (!form.title.trim()) return alert("Title required"); onSave(form); }} className="w-full py-3 bg-cocoa-600 text-white rounded-2xl font-medium">Save Recipe</button>
            </div>
          </div>
        </div>
      );
    }

    // ========== MAIN APP ==========
    function App() {
      const [tab, setTab] = useState("recipes");
      const [recipes, setRecipes] = useState(() => {
        try { const s = localStorage.getItem("fr_recipes_v3"); return s ? JSON.parse(s) : sampleRecipes; } catch { return sampleRecipes; }
      });
      const [prefs, setPrefs] = useState(() => {
        try { const s = localStorage.getItem("fr_prefs_v3"); return s ? JSON.parse(s) : defaultPrefs; } catch { return defaultPrefs; }
      });
      const [weeks, setWeeks] = useState(() => {
        try { const s = localStorage.getItem("fr_weeks_v3"); if (s) return JSON.parse(s); } catch {}
        return { [getWeekKey(0)]: emptyWeek() };
      });
      const [weekOffset, setWeekOffset] = useState(0);
      const [plannerMeal, setPlannerMeal] = useState("dinner"); // breakfast | lunch | dinner | all
      const [selectedRecipe, setSelectedRecipe] = useState(null);
      const [editingRecipe, setEditingRecipe] = useState(false);
      const [editForm, setEditForm] = useState(null);
      const [servingMult, setServingMult] = useState(1);
      const [search, setSearch] = useState("");
      const [filterCal, setFilterCal] = useState("");
      const [filterDiet, setFilterDiet] = useState("");
      const [showAdd, setShowAdd] = useState(false);
      const [importUrl, setImportUrl] = useState("");
      const [importPreview, setImportPreview] = useState(null);
      const [importLoading, setImportLoading] = useState(false);
      const [showAllFavorites, setShowAllFavorites] = useState(false);
      const [showAllRecipes, setShowAllRecipes] = useState(false);
      const [addToPlannerMode, setAddToPlannerMode] = useState(false);
      const [groceryChecked, setGroceryChecked] = useState(() => {
        try { return JSON.parse(localStorage.getItem("fr_gcheck") || "{}"); } catch { return {}; }
      });
      const [groceryRemoved, setGroceryRemoved] = useState(() => {
        try { return JSON.parse(localStorage.getItem("fr_grem") || "[]"); } catch { return []; }
      });
      const [newStoreName, setNewStoreName] = useState("");
      const [discoverIngredients, setDiscoverIngredients] = useState("");
      const [discoverFilter, setDiscoverFilter] = useState("");
      const [discoverResults, setDiscoverResults] = useState([]);
      const [favoritePrompt, setFavoritePrompt] = useState(null);
      const [favDismissed, setFavDismissed] = useState(() => {
        try { return JSON.parse(localStorage.getItem("fr_fav_dismissed") || "[]"); } catch { return []; }
      });
      const [plannerTargetMeal, setPlannerTargetMeal] = useState("dinner");
      const [editingItemAisle, setEditingItemAisle] = useState(null);
      const [aiLoading, setAiLoading] = useState(false);
      const [aiElapsed, setAiElapsed] = useState(0);
      const [aiProgress, setAiProgress] = useState(null);
      const aiAbort = useRef(null);
      const [importStatus, setImportStatus] = useState("");
      const [cookingRecipe, setCookingRecipe] = useState(null);
      const [priceSheet, setPriceSheet] = useState(null);
      const [pricingAll, setPricingAll] = useState(false);
      const pendingPick = useRef(null);
      const [toast, setToast] = useState("");
      const [bulkStatus, setBulkStatus] = useState("");
      const [webResults, setWebResults] = useState([]);
      const [webLoading, setWebLoading] = useState(false);
      const [webError, setWebError] = useState("");
      const [webImportingId, setWebImportingId] = useState(null);
      const webSearchId = useRef(0);
      const photoBusy = useRef(false);
      const [aiError, setAiError] = useState("");
      const [photoSearchOpen, setPhotoSearchOpen] = useState(false);
      const [photoSearchQuery, setPhotoSearchQuery] = useState("");
      const [photoResults, setPhotoResults] = useState([]);
      const [photoLoading, setPhotoLoading] = useState(false);
      const [photoTarget, setPhotoTarget] = useState(null); // 'edit' | 'add' | recipe id
      const [madeThis, setMadeThis] = useState(null); // { id, title }
      const [madeRating, setMadeRating] = useState(0);
      const [madeFavorite, setMadeFavorite] = useState(false);



      const currentWeekKey = getWeekKey(weekOffset);
      const planner = weeks[currentWeekKey] || emptyWeek();

      useEffect(() => { safeSave("fr_recipes_v3", recipes); }, [recipes]);
      useEffect(() => {
        if (photoBusy.current || (typeof navigator !== "undefined" && navigator.onLine === false)) return;
        const target = recipes.find(r => !r.image && (r.imgScan || 0) < PHOTO_SCAN_VERSION);
        if (!target) return;
        photoBusy.current = true;
        findPhotoFor(target.title, (prefs.unsplashAccessKey || "").trim(), target.url)
          .catch(() => null)
          .then(url => setRecipes(prev => prev.map(x => x.id === target.id ? { ...x, image: x.image || url || null, imgScan: PHOTO_SCAN_VERSION, imageAuto: !!url } : x)))
          .finally(() => { photoBusy.current = false; });
      }, [recipes]);
      useEffect(() => { if (prefs.weeklyBudget == null) { const b = localStorage.getItem("fr_budget"); if (b) setPrefs(p => ({ ...p, weeklyBudget: b })); } }, []);
      useEffect(() => {
        if (!aiLoading) return;
        setAiElapsed(0);
        const t = setInterval(() => setAiElapsed(s => s + 1), 1000);
        return () => clearInterval(t);
      }, [aiLoading]);
      useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 4000); return () => clearTimeout(t); }, [toast]);
      useEffect(() => { safeSave("fr_prefs_v3", prefs); }, [prefs]);
      useEffect(() => { safeSave("fr_weeks_v3", weeks); }, [weeks]);
      useEffect(() => { safeSave("fr_gcheck", groceryChecked); }, [groceryChecked]);
      useEffect(() => { safeSave("fr_grem", groceryRemoved); }, [groceryRemoved]);
      useEffect(() => { safeSave("fr_fav_dismissed", favDismissed); }, [favDismissed]);

      useEffect(() => {
        if (!weeks[currentWeekKey]) setWeeks(w => ({ ...w, [currentWeekKey]: emptyWeek() }));
      }, [currentWeekKey]);

      useEffect(() => {
        const candidate = recipes.find(r => !r.favorite && (r.timesUsed || 0) >= 6 && !favDismissed.includes(r.id));
        if (candidate && !favoritePrompt) setFavoritePrompt(candidate);
      }, [recipes, favDismissed]);

      const updatePlanner = useCallback((day, meal, data) => {
        // meal = "breakfast" | "lunch" | "dinner"
        setWeeks(w => {
          const week = w[currentWeekKey] || emptyWeek();
          const dayData = week[day] || { breakfast: emptySlot(), lunch: emptySlot(), dinner: emptySlot() };
          // Support old single-slot data if present
          const currentSlot = dayData[meal] || (dayData.type ? dayData : emptySlot());
          return {
            ...w,
            [currentWeekKey]: {
              ...week,
              [day]: {
                breakfast: dayData.breakfast || emptySlot(),
                lunch: dayData.lunch || emptySlot(),
                dinner: dayData.dinner || emptySlot(),
                [meal]: { ...currentSlot, ...data }
              }
            }
          };
        });
      }, [currentWeekKey]);

      // Smart Auto-Fill based on Prefs
      const autoFillWeek = useCallback(() => {
        const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        const current = weeks[currentWeekKey] || emptyWeek();
        const targetMeal = plannerMeal === "all" ? "dinner" : plannerMeal;

        const getSlot = (d) => {
          const dayData = current[d] || {};
          return dayData[targetMeal] || (dayData.type && targetMeal === "dinner" ? dayData : emptySlot());
        };

        const emptyDays = days.filter(d => {
          const slot = getSlot(d);
          return slot.type === "cook" && !slot.recipeId;
        });

        if (emptyDays.length === 0) {
          alert("No open Cook days to fill. Change some days to 'Cook' or clear existing recipes first.");
          return;
        }

        const avoid = (prefs.avoidIngredients || []).map(x => x.toLowerCase());
        const allergies = (prefs.allergies || []).map(x => x.toLowerCase());
        const favIngs = (prefs.favoriteIngredients || []).map(x => x.toLowerCase());
        const priority = prefs.priorityNutrient || "protein";

        const scored = recipes
          .filter(r => {
            if (allergies.length && (r.ingredients || []).some(i => allergies.some(a => i.name.toLowerCase().includes(a)))) return false;
            return true;
          })
          .map(r => {
            let score = (r.rating || 0) * 10;
            if (r.favorite) score += 40;
            score += (r.timesUsed || 0) * 2;
            (r.ingredients || []).forEach(i => {
              if (favIngs.some(f => i.name.toLowerCase().includes(f))) score += 15;
              if (avoid.some(a => i.name.toLowerCase().includes(a))) score -= 25;
            });
            if (priority === "protein") score += (r.nutrition?.protein || 0) * 0.8;
            else if (priority === "fiber") score += (r.nutrition?.fiber || 0) * 3;
            else if (priority === "low-carb") score += Math.max(0, 40 - (r.nutrition?.carbs || 0));
            const cal = r.nutrition?.calories || 400;
            const target = (prefs.calorieTarget || 2000) / 3;
            if (cal > target * 1.4) score -= 15;
            if (cal < target * 0.6) score -= 8;
            if (r.category === "Dinner") score += 8;
            return { r, score };
          })
          .sort((a, b) => b.score - a.score);

        if (scored.length === 0) {
          alert("No suitable recipes found. Add more recipes or relax your avoid/allergy lists.");
          return;
        }

        const usedIds = new Set(days.map(d => getSlot(d).recipeId).filter(Boolean));
        const newPlanner = { ...current };
        let idx = 0;

        emptyDays.forEach(day => {
          let pick = null;
          for (let i = 0; i < scored.length; i++) {
            const candidate = scored[(idx + i) % scored.length];
            if (!usedIds.has(candidate.r.id)) {
              pick = candidate.r;
              idx = (idx + i + 1) % scored.length;
              break;
            }
          }
          if (!pick) pick = scored[idx % scored.length].r;

          const dayData = newPlanner[day] || { breakfast: emptySlot(), lunch: emptySlot(), dinner: emptySlot() };
          newPlanner[day] = {
            breakfast: dayData.breakfast || emptySlot(),
            lunch: dayData.lunch || emptySlot(),
            dinner: dayData.dinner || emptySlot(),
            [targetMeal]: { type: "cook", recipeId: pick.id, note: "" }
          };
          usedIds.add(pick.id);
        });

        setWeeks(w => ({ ...w, [currentWeekKey]: newPlanner }));
        alert(`Filled ${emptyDays.length} open ${targetMeal} day${emptyDays.length > 1 ? "s" : ""} with smart suggestions.`);
      }, [weeks, currentWeekKey, recipes, prefs, plannerMeal]);

      const getScaledNutrition = (r, mult) => {
        if (!r?.nutrition) return {};
        const n = r.nutrition;
        return { calories: Math.round(n.calories * mult), protein: Math.round(n.protein * mult), carbs: Math.round(n.carbs * mult), fat: Math.round(n.fat * mult), fiber: Math.round(n.fiber * mult) };
      };

      const getScaledIngredients = (r, mult) => {
        if (!r?.ingredients) return [];
        return r.ingredients.map(ing => ({ ...ing, amount: +(ing.amount * mult).toFixed(2) }));
      };

      const recipeHasAvoid = (r) => {
        const avoid = (prefs.avoidIngredients || []).map(x => x.toLowerCase());
        return (r.ingredients || []).some(i => avoid.some(a => i.name.toLowerCase().includes(a)));
      };

      const recipeHasAllergy = (r) => {
        const all = (prefs.allergies || []).map(x => x.toLowerCase());
        return (r.ingredients || []).some(i => all.some(a => i.name.toLowerCase().includes(a)));
      };

      const filteredRecipes = useMemo(() => {
        return recipes.filter(r => {
          const q = search.toLowerCase();
          const matchSearch = !q || r.title.toLowerCase().includes(q) ||
            (r.ingredients || []).some(i => i.name.toLowerCase().includes(q)) ||
            (r.dietTags || []).some(t => t.toLowerCase().includes(q)) ||
            (r.category || "").toLowerCase().includes(q);
          const matchCal = !filterCal || (r.nutrition?.calories || 9999) <= Number(filterCal);
          const matchDiet = !filterDiet || (r.dietTags || []).includes(filterDiet);
          return matchSearch && matchCal && matchDiet;
        }).sort((a, b) => {
          let scoreA = (a.rating || 0) + (a.favorite ? 3 : 0) + (a.timesUsed || 0) * 0.1;
          let scoreB = (b.rating || 0) + (b.favorite ? 3 : 0) + (b.timesUsed || 0) * 0.1;
          const favIng = (prefs.favoriteIngredients || []).map(x => x.toLowerCase());
          (a.ingredients || []).forEach(i => { if (favIng.some(l => i.name.toLowerCase().includes(l))) scoreA += 0.4; });
          (b.ingredients || []).forEach(i => { if (favIng.some(l => i.name.toLowerCase().includes(l))) scoreB += 0.4; });
          return scoreB - scoreA;
        });
      }, [recipes, search, filterCal, filterDiet, prefs.favoriteIngredients]);

      const favorites = useMemo(() => filteredRecipes.filter(r => r.favorite), [filteredRecipes]);
      const nonFavorites = useMemo(() => filteredRecipes.filter(r => !r.favorite), [filteredRecipes]);

      const groceryList = useMemo(() => {
        const map = {};
        const addFromSlot = (slot) => {
          if (!slot || slot.type !== "cook" || !slot.recipeId) return;
          const r = recipes.find(x => x.id === slot.recipeId);
          if (!r) return;
          const mult = (prefs.familySize || 4) / (r.baseServings || 4);
          getScaledIngredients(r, mult).forEach(ing => {
            const nameKey = ing.name.trim().toLowerCase();
            const unitKey = (ing.unit || "").trim().toLowerCase().replace(/s$/, "");
            const key = `${nameKey}|${unitKey}`;
            if (groceryRemoved.includes(`${currentWeekKey}|${key}`)) return;
            if (!map[key]) map[key] = { name: ing.name, amount: 0, unit: ing.unit, aisle: ing.aisle || "Other", key, nameKey };
            map[key].amount += ing.amount;
          });
        };
        Object.values(planner).forEach(day => {
          // New structure
          if (day.breakfast || day.lunch || day.dinner) {
            addFromSlot(day.breakfast);
            addFromSlot(day.lunch);
            addFromSlot(day.dinner);
          } else {
            // Old single-slot structure
            addFromSlot(day);
          }
        });
        const byAisle = {};
        Object.values(map).forEach(item => {
          const aisle = item.aisle || "Other";
          if (!byAisle[aisle]) byAisle[aisle] = [];
          byAisle[aisle].push({ ...item, amount: +item.amount.toFixed(2) });
        });
        return byAisle;
      }, [planner, recipes, prefs.familySize, groceryRemoved, currentWeekKey]);
      const removedThisWeek = groceryRemoved.filter(k => k.startsWith(currentWeekKey + "|"));

      const toggleFavorite = useCallback((id) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, favorite: !r.favorite } : r));
      }, []);

      const setRating = useCallback((id, rating) => {
        setRecipes(prev => prev.map(r => r.id === id ? { ...r, rating } : r));
      }, []);

      const deleteRecipe = useCallback((id) => {
        if (!confirm("Delete this recipe?")) return;
        setRecipes(prev => prev.filter(r => r.id !== id));
        setSelectedRecipe(null);
      }, []);

      const addRecipe = useCallback((recipe) => {
        const newR = { ...recipe, id: uid(), favorite: false, rating: 0, timesUsed: 0, _ts: Date.now() };
        setRecipes(prev => [newR, ...prev]);
        setShowAdd(false);
        setImportPreview(null);
        setImportUrl("");
      }, []);

      const tryImportUrl = async (urlArg) => {
        let url = (typeof urlArg === "string" ? urlArg : importUrl).trim();
        if (!url) return;
        if (!/^https?:\/\//i.test(url)) url = "https://" + url;
        setImportUrl(url);
        setImportLoading(true);
        setImportPreview(null);
        const blank = { title: "New Recipe from URL", category: "Dinner", dietTags: [], baseServings: 4, nutrition: { calories: 400, protein: 25, carbs: 30, fat: 15, fiber: 5 }, ingredients: [{ name: "Ingredient 1", amount: 1, unit: "", aisle: "Other" }], instructions: "Source: " + url, url, image: null };
        try {
          const html = await fetchPageHtml(url, setImportStatus);
          setImportStatus("Reading recipe…");
          const ld = extractJsonLdRecipe(html, url);
          if (ld) { setImportPreview(ld); return; }
          const key = (prefs.geminiApiKey || "").trim();
          const text = pageText(html).slice(0, 15000);
          if (key && text.length > 300) {
            try {
              const rec = await callGeminiRecipe(key, `Extract the recipe from this web page text. Keep the original ingredients, amounts and steps; do not invent a different recipe. If nutrition isn't given, estimate it. Page text:\n\n${text}`, { mode: prefs.aiMode || "fast", onProgress: (p) => setImportStatus(describeAiProgress(p)) });
              setImportPreview({ ...rec, image: metaImage(html, url), url, instructions: rec.instructions + "\n\nSource: " + url });
              return;
            } catch (e) { setImportStatus("AI couldn't read it (" + e.message + ") - using basic import…"); }
          }
          const titleMatch = html.match(/<meta[^>]+property=["']og:title["'][^>]*content=["']([^"']+)["']/i) || html.match(/<title[^>]*>([^<]+)<\/title>/i);
          const title = titleMatch ? decodeHtml(titleMatch[1]).replace(/\s[|–-]\s.*$/, "").trim() : "Imported Recipe";
          let ingredients = [];
          const ingSection = html.match(/ingredients?[^<]*<\/h[2-4]>([\s\S]*?)(?:instructions?|directions?|method|steps|preparation)/i);
          if (ingSection) ingredients = [...ingSection[1].matchAll(/<li[^>]*>([\s\S]*?)<\/li>/gi)].slice(0, 30).map(m => decodeHtml(m[1])).filter(t => t.length > 2 && t.length < 120).map(parseIngredientLine);
          let instructions = "Please paste or edit the full instructions here.\n\nSource: " + url;
          const instMatch = html.match(/(?:instructions?|directions?|method|steps)[^<]*<\/h[2-4]>([\s\S]{50,4000}?)<\/(?:ol|section)/i);
          if (instMatch) {
            const lis = [...instMatch[1].matchAll(/<li[^>]*>([\s\S]*?)<\/li>/gi)].map(m => decodeHtml(m[1])).filter(Boolean);
            const clean = lis.length ? lis.map((t, i) => `${i + 1}. ${t}`).join("\n") : decodeHtml(instMatch[1]).slice(0, 2000);
            if (clean.length > 40) instructions = clean + "\n\nSource: " + url;
          }
          setImportPreview({ ...blank, title, ingredients: ingredients.length ? ingredients : blank.ingredients, instructions, image: metaImage(html, url) });
          if (!key) alert("This site doesn't publish its recipe in a standard format, so only part of it was imported. Add a Gemini key in Prefs and the app will use AI to read pages like this.");
        } catch (e) {
          alert("Couldn't load that page (" + e.message + "). Some sites block apps from reading them. You can still fill in the form by hand.");
          setImportPreview(blank);
        } finally { setImportLoading(false); setImportStatus(""); }
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        compressImage(file).then(dataUrl => {
          setImportPreview(prev => ({
            ...(prev || { title: "Photo Recipe", category: "Dinner", dietTags: [], baseServings: 4, nutrition: { calories: 400, protein: 25, carbs: 30, fat: 15, fiber: 5 }, ingredients: [{ name: "Ingredient (edit)", amount: 1, unit: "", aisle: "Other" }], instructions: "Add instructions." }),
            image: dataUrl, title: (prev && prev.title) || "Recipe from Photo"
          }));
        }).catch(() => alert("Could not read that image."));
      };

      const updateAisleNumber = (store, aisleName, num) => {
        setPrefs(p => ({ ...p, stores: { ...p.stores, [store]: { ...p.stores[store], [aisleName]: Number(num) || 99 } } }));
      };

      const changeItemAisle = (itemKey, newAisle) => {
        setRecipes(prev => prev.map(r => ({
          ...r,
          ingredients: (r.ingredients || []).map(ing =>
            ing.name.toLowerCase() === itemKey ? { ...ing, aisle: newAisle } : ing
          )
        })));
        setEditingItemAisle(null);
      };

      const addCustomStore = () => {
        const name = newStoreName.trim();
        if (!name || prefs.stores[name]) return;
        setPrefs(p => ({ ...p, stores: { ...p.stores, [name]: { ...defaultAisles } }, preferredStore: name }));
        setNewStoreName("");
      };

      const runDiscover = () => {
        const ings = discoverIngredients.toLowerCase().split(/[,\s]+/).filter(Boolean);
        const matches = recipes.filter(r => {
          if (ings.length === 0) return true;
          return ings.some(ing => (r.ingredients || []).some(i => i.name.toLowerCase().includes(ing)));
        }).filter(r => {
          if (!discoverFilter) return true;
          if (discoverFilter === "Low-Calorie") return (r.nutrition?.calories || 999) < 400;
          if (discoverFilter === "High-Protein") return (r.nutrition?.protein || 0) > 30;
          if (discoverFilter === "Heart-Healthy") return (r.dietTags || []).includes("Heart-Healthy");
          if (discoverFilter === "Crockpot") return r.title.toLowerCase().includes("crock") || r.title.toLowerCase().includes("slow");
          return (r.dietTags || []).includes(discoverFilter) || r.category === discoverFilter;
        });
        setDiscoverResults(matches.length ? matches : recipes.slice(0, 4));
      };

      // ---- AI Chef (Gemini) ----
      const generateAiRecipe = async () => {
        setAiError("");
        const key = (prefs.geminiApiKey || "").trim();
        if (!key) { setAiError("AI Chef needs a Gemini API key. Add one in Prefs (free at aistudio.google.com)."); return; }
        const ctrl = new AbortController();
        aiAbort.current = ctrl;
        setAiProgress(null);
        setAiLoading(true);
        try {
          const ingsRaw = discoverIngredients.trim();
          const ings = ingsRaw || "common pantry ingredients";
          const onHand = ingsRaw.toLowerCase().split(/[,\s]+/).map(s => s.trim()).filter(Boolean);
          const style = discoverFilter || "family-friendly";
          // Avoid list is overridden by anything the user listed as on-hand for this generation
          const avoidFiltered = (prefs.avoidIngredients || []).filter(a => {
            const al = a.toLowerCase();
            return !onHand.some(h => h.includes(al) || al.includes(h));
          });
          const avoid = avoidFiltered.join(", ") || "none";
          const allergies = (prefs.allergies || []).join(", ") || "none";
          const prompt = `You are a professional family chef. Reply with ONLY valid minified JSON. No markdown. No code fences. No extra text.
Use this exact schema:
{"title":"string","category":"Dinner","dietTags":["High-Protein"],"baseServings":4,"nutrition":{"calories":400,"protein":30,"carbs":25,"fat":15,"fiber":5},"ingredients":[{"name":"string","amount":1,"unit":"cup","aisle":"Produce"}],"steps":["step 1","step 2","step 3"]}
Rules: steps must be a JSON array of short strings (no newlines inside strings). ingredients max 12 items. category one of Dinner,Lunch,Breakfast,Snack,Dessert. aisle one of: Produce, Meat & Seafood, Dairy & Eggs, Bakery, Frozen, Pantry / Canned, Spices & Baking, Beverages, Snacks, Other.
IMPORTANT ingredient rules:
1) MUST use these on-hand ingredients when provided: ${ings}. Do not replace them with substitutes.
2) Still avoid these (unless they appear in the on-hand list above): ${avoid}.
3) NEVER use these allergens under any circumstance: ${allergies}.
Style: ${style}. Prefer ${prefs.priorityNutrient || "protein"}. Servings ~${prefs.familySize || 4}.`;

          const recipe = await callGeminiRecipe(key, prompt, { signal: ctrl.signal, onProgress: setAiProgress, mode: prefs.aiMode || "fast" });
          setImportPreview(recipe);
          setShowAdd(true);
        } catch (e) {
          if (!ctrl.signal.aborted) setAiError(e.message || "Something went wrong. Please try again.");
        } finally { setAiLoading(false); aiAbort.current = null; }
      };

      const runWebSearch = async () => {
        const q = [discoverIngredients.trim(), discoverFilter].filter(Boolean).join(" ");
        if (!q) { alert("Type what you have (or a dish name) first."); return; }
        const id = ++webSearchId.current;
        setWebLoading(true); setWebError(""); setWebResults([]);
        const [db, web] = await Promise.allSettled([searchMealDb(discoverIngredients.trim() || q), searchWebRecipes(q)]);
        if (id !== webSearchId.current) return;
        const list = [...(web.status === "fulfilled" ? web.value : []), ...(db.status === "fulfilled" ? db.value : [])];
        setWebResults(list);
        if (!list.length) setWebError("No web results came back. Try different words, or use “More on Google”.");
        else if (web.status === "rejected") setWebError("General web search is unavailable right now; showing recipe-database results.");
        setWebLoading(false);
        const queue = list.filter(r => !r.image);
        const worker = async () => {
          while (queue.length && id === webSearchId.current) {
            const r = queue.shift();
            const img = await thumbForWebResult(r).catch(() => null);
            if (id !== webSearchId.current) return;
            setWebResults(prev => prev.map(x => x.url === r.url ? { ...x, image: img || "", thumbTried: true } : x));
          }
        };
        Promise.all([worker(), worker(), worker()]);
      };
      const importWebResult = async (res) => {
        if (res.kind === "mealdb") {
          setWebImportingId(res.id);
          try { setImportPreview(await mealDbToRecipe(res.id)); setShowAdd(true); } catch (e) { alert("Couldn't load that recipe: " + e.message); }
          setWebImportingId(null);
        } else { setShowAdd(true); tryImportUrl(res.url); }
      };

      const handleCollectionFile = async (e) => {
        const file = e.target.files?.[0];
        e.target.value = "";
        if (!file) return;
        try {
          let list = await importRecipeCollection(file, setBulkStatus);
          if (!list.length) { setBulkStatus(""); alert("No recipes were found in that file. If it came from another app, send me a sample and the importer can be adjusted."); return; }
          const have = new Set(recipes.map(r => r.title.trim().toLowerCase()));
          const fresh = list.filter(r => !have.has(r.title.trim().toLowerCase()));
          const dupes = list.length - fresh.length;
          if (!fresh.length) { setBulkStatus(""); alert(`All ${list.length} recipes are already in your book.`); return; }
          const photoBytes = fresh.reduce((n, r) => n + (r.image && r.image.startsWith("data:") ? r.image.length : 0), 0);
          let note = "";
          if (photoBytes > 2500000) { list = fresh.map(r => r.image && r.image.startsWith("data:") ? { ...r, image: null } : r); note = "\n\nYour export's photos are too large to store, so the app will find photos online instead."; }
          else list = fresh;
          if (!confirm(`Import ${list.length} recipe${list.length === 1 ? "" : "s"}?${dupes ? ` (${dupes} already in your book will be skipped)` : ""}${note}`)) { setBulkStatus(""); return; }
          const now = Date.now();
          setRecipes(prev => [...list.map((r, k) => ({ ...r, id: uid(), favorite: false, rating: r.rating || 0, timesUsed: 0, imgScan: 0, _ts: now - k })), ...prev]);
          setBulkStatus("");
          setToast(`Imported ${list.length} recipes ✓`);
        } catch (err) { setBulkStatus(""); alert("Import failed: " + err.message); }
      };

      // ===== ACCOUNTS + CLOUD SYNC =====
      const [account, setAccount] = useState({ status: "loading" });
      const [syncStatus, setSyncStatus] = useState("");
      const [bookmarkHelpOpen, setBookmarkHelpOpen] = useState(false);
      const [bookmarkCopied, setBookmarkCopied] = useState(false);
      const appReady = account.status === "in" || account.status === "local";
      const accountRef = useRef(account); accountRef.current = account;
      const syncReady = useRef(false);
      const handledUid = useRef(null);
      const lastStateJson = useRef("");
      const lastRecipes = useRef(new Map());
      const pendingProduct = useRef(null);
      const latest = useRef({});
      latest.current = { recipes, prefs, weeks, groceryChecked, groceryRemoved, favDismissed };
      const stateSnapshot = (v) => JSON.stringify({ prefs: v.prefs, weeks: v.weeks, groceryChecked: v.groceryChecked, groceryRemoved: v.groceryRemoved, favDismissed: v.favDismissed });

      const pushRecipes = async () => {
        const a = accountRef.current;
        if (!syncReady.current || a.status !== "in") return;
        const next = new Map(latest.current.recipes.map(r => [r.id, JSON.stringify(r)]));
        const ops = [];
        next.forEach((json, id) => { if (lastRecipes.current.get(id) !== json) ops.push({ id, json }); });
        lastRecipes.current.forEach((_, id) => { if (!next.has(id)) ops.push({ id, del: true }); });
        if (!ops.length) return;
        setSyncStatus("saving");
        try { await cloudWriteRecipes(a.uid, ops); lastRecipes.current = next; setSyncStatus("saved"); }
        catch (e) { setSyncStatus("error"); }
      };
      const pushState = async () => {
        const a = accountRef.current;
        if (!syncReady.current || a.status !== "in") return;
        const json = stateSnapshot(latest.current);
        if (json === lastStateJson.current) return;
        setSyncStatus("saving");
        try { await cloudWriteState(a.uid, json); lastStateJson.current = json; setSyncStatus("saved"); }
        catch (e) { setSyncStatus("error"); }
      };
      useEffect(() => { if (account.status !== "in") return; const t = setTimeout(pushRecipes, 1200); return () => clearTimeout(t); }, [recipes, account.status]);
      useEffect(() => { if (account.status !== "in") return; const t = setTimeout(pushState, 1500); return () => clearTimeout(t); }, [prefs, weeks, groceryChecked, groceryRemoved, favDismissed, account.status]);
      // Retry failed saves when the connection comes back
      useEffect(() => { const on = () => { pushRecipes(); pushState(); }; window.addEventListener("online", on); return () => window.removeEventListener("online", on); }, []);
      // Give every recipe a stable sort time (keeps the same order on every device)
      useEffect(() => {
        if (recipes.some(r => !r._ts)) { const now = Date.now(); setRecipes(prev => prev.map((r, i) => r._ts ? r : { ...r, _ts: now - i * 1000 })); }
      }, [recipes]);

      const handleSignedIn = async (user, { isNew = false } = {}) => {
        if (handledUid.current === user.uid) return;
        handledUid.current = user.uid;
        syncReady.current = false;
        setAccount({ status: "syncing" });
        try {
          const { profile, stateJson, recipes: cloudRecipes } = await cloudLoad(user.uid);
          const empty = !stateJson && cloudRecipes.length === 0;
          if (empty) {
            lastStateJson.current = "";
            lastRecipes.current = new Map();
            if (isNew) setPrefs(p => ({ ...p, onboarded: false }));
          } else {
            const st = stateJson ? JSON.parse(stateJson) : {};
            const sorted = cloudRecipes.sort((a, b) => (b._ts || 0) - (a._ts || 0));
            setRecipes(sorted);
            if (st.prefs) setPrefs({ ...defaultPrefs, ...st.prefs });
            if (st.weeks) setWeeks(st.weeks);
            setGroceryChecked(st.groceryChecked || {});
            setGroceryRemoved(st.groceryRemoved || []);
            setFavDismissed(st.favDismissed || []);
            lastStateJson.current = stateJson || "";
            lastRecipes.current = new Map(sorted.map(r => [r.id, JSON.stringify(r)]));
          }
          localStorage.removeItem("fr_mode");
          setAccount({ status: "in", uid: user.uid, email: user.email, username: profile?.username || String(user.email || "").split("@")[0] });
          syncReady.current = true;
          setSyncStatus(empty ? "saving" : "saved");
        } catch (e) {
          handledUid.current = null;
          setAccount({ status: "error", message: "Couldn't load your account: " + friendlyAuthError(e) });
        }
      };
      useEffect(() => {
        if (location.hash.startsWith("#fr-product=")) {
          try { pendingProduct.current = JSON.parse(decodeURIComponent(location.hash.slice(12))); } catch {}
          history.replaceState(null, "", location.pathname + location.search);
        }
        if (!FIREBASE_CONFIG || localStorage.getItem("fr_mode") === "local") {
          setAccount({ status: localStorage.getItem("fr_mode") === "local" ? "local" : "out" });
          return;
        }
        let unsub = null;
        initFirebase().then(fb => {
          unsub = fb.auth.onAuthStateChanged(user => {
            if (signupInProgress) return;
            if (user) handleSignedIn(user);
            else { handledUid.current = null; syncReady.current = false; setAccount({ status: "out" }); }
          });
        }).catch(() => setAccount({ status: "out", loadError: true }));
        return () => unsub && unsub();
      }, []);
      const logOut = async () => {
        if (!confirm("Log out? Everything stays saved in your account.")) return;
        await Promise.allSettled([pushRecipes(), pushState()]);
        syncReady.current = false;
        try { await (await initFirebase()).auth.signOut(); } catch {}
        ["fr_recipes_v3", "fr_prefs_v3", "fr_weeks_v3", "fr_gcheck", "fr_grem", "fr_fav_dismissed", "fr_pending_pick", "fr_budget", "fr_mode"].forEach(k => localStorage.removeItem(k));
        location.reload();
      };
      const openBookmarkHelper = () => {
        setBookmarkCopied(false);
        if (navigator.clipboard) navigator.clipboard.writeText(bookmarkletCode).then(() => setBookmarkCopied(true), () => {});
        setBookmarkHelpOpen(true);
      };

      // ---- Store prices: items live with the store whose price you saved ----
      const storeNames = Object.keys(prefs.stores || {});
      const currentStore = prefs.preferredStore || storeNames[0] || "HEB";
      const allMatches = prefs.storeMatches || {};
      const offersFor = (nameKey) => storeNames.map(st => allMatches[st]?.[nameKey] ? { store: st, ...allMatches[st][nameKey] } : null).filter(Boolean);
      const placeItem = (nameKey) => {
        const offers = offersFor(nameKey);
        const priced = offers.filter(o => o.price != null).sort((a, b) => a.price - b.price);
        if (priced.length) return { store: priced[0].store, match: priced[0], others: priced.slice(1) };
        return { store: currentStore, match: offers.find(o => o.store === currentStore) || null, others: [] };
      };
      const groceryByStore = useMemo(() => {
        const out = {};
        Object.entries(groceryList).forEach(([aisle, items]) => items.forEach(it => {
          const place = placeItem(it.nameKey);
          ((out[place.store] = out[place.store] || {})[aisle] = out[place.store][aisle] || []).push({ ...it, place });
        }));
        return out;
      }, [groceryList, prefs.storeMatches, currentStore, prefs.stores]);
      const storeOrder = [currentStore, ...Object.keys(groceryByStore).filter(st => st !== currentStore).sort()].filter(st => groceryByStore[st]);
      const groceryItemsAll = Object.values(groceryList).flat();
      const pricedItems = Object.values(groceryByStore).flatMap(a => Object.values(a).flat()).filter(it => it.place.match?.price != null);
      const groceryTotal = pricedItems.reduce((sum, it) => sum + it.place.match.price, 0);
      const weeklyBudget = Number(String(prefs.weeklyBudget ?? "").replace(/[^0-9.]/g, "")) || 0;
      const saveStoreMatch = (store, nameKey, match) => {
        setPrefs(p => {
          const all = p.storeMatches || {};
          const forStore = { ...(all[store] || {}) };
          if (match) forStore[nameKey] = match; else delete forStore[nameKey];
          return { ...p, storeMatches: { ...all, [store]: forStore } };
        });
      };
      const sheetFor = (item, store) => {
        const existing = allMatches[store]?.[item.nameKey];
        pendingPick.current = { ...item, store };
        try { localStorage.setItem("fr_pending_pick", JSON.stringify({ nameKey: item.nameKey, name: item.name, key: item.key, store })); } catch {}
        return { item, store, results: [], loading: false, error: "", linkInput: "", linkBusy: false, linkMsg: "", debug: "",
          manual: { name: existing?.name || "", price: existing?.price ?? "", aisle: existing?.aisle || "", url: existing?.url || "", size: existing?.size || "", unitPrice: existing?.unitPrice || "" } };
      };
      const openPriceSheet = async (item, store = currentStore) => {
        const api = (prefs.priceApiUrl || "").trim();
        setPriceSheet({ ...sheetFor(item, store), loading: !!api });
        if (!api) return;
        try {
          const products = await searchStorePrices(api, store, item.name, prefs.storeZip);
          setPriceSheet(ps => ps && ps.item.key === item.key && ps.store === store ? { ...ps, loading: false, results: recommendProduct(item.name, products).slice(0, 8) } : ps);
        } catch (e) { setPriceSheet(ps => ps && ps.item.key === item.key && ps.store === store ? { ...ps, loading: false, error: e.message } : ps); }
      };
      const applyProduct = (d, { fromLink = false } = {}) => {
        let target = pendingPick.current;
        if (!target) { try { target = JSON.parse(localStorage.getItem("fr_pending_pick") || "null"); } catch {} }
        if (!target || !d) return;
        const store = target.store || currentStore;
        const outdated = d.type === "fr-product" && !fromLink && (!d.v || d.v < BOOKMARK_VERSION);
        const match = { name: (d.name || "").trim() || target.name, price: d.price != null && d.price !== "" && !isNaN(d.price) ? Number(d.price) : null, aisle: (d.aisle || "").trim(), size: d.size || "", unitPrice: d.unitPrice || "", estimated: !!d.priceEstimated, url: d.url || "" };
        if (match.price != null && match.aisle) {
          saveStoreMatch(store, target.nameKey, match);
          setPriceSheet(null);
          pendingPick.current = null;
          try { localStorage.removeItem("fr_pending_pick"); } catch {}
          setToast(`Saved ✓ ${match.name} · $${match.price.toFixed(2)} · ${match.aisle} (${store})`);
        } else {
          const item = { name: target.name, nameKey: target.nameKey, key: target.key || target.nameKey };
          const missing = [match.price == null && "price", !match.aisle && "aisle"].filter(Boolean).join(" and ");
          setPriceSheet(ps => ({
            ...(ps || { item, store, results: [], loading: false, error: "", linkInput: "" }),
            linkBusy: false, debug: d.debug || "",
            manual: { name: match.name, price: match.price ?? "", aisle: match.aisle, url: match.url, size: match.size, unitPrice: match.unitPrice },
            linkMsg: outdated
              ? `Your “Send to Recipe App” bookmark is an older version. Tap “Update the Send to Recipe App button” below, then try again. For now, type the ${missing} below.`
              : `Got the product${match.price != null ? " and price" : ""}. ${fromLink ? "The store doesn't let apps read the rest of its page, so " : "Couldn't spot the " + missing + " on that page, so "}fill in the ${missing} below and tap Save.${d.debug ? " (See “What the bookmark saw” below.)" : ""}`
          }));
        }
      };
      const useProductLink = async (link) => {
        const url = (link || "").trim().match(/https?:\/\/\S+/)?.[0];
        if (!url) { setPriceSheet(ps => ({ ...ps, linkMsg: "That doesn't look like a link. Copy the product page's address and try again." })); return; }
        setPriceSheet(ps => ({ ...ps, linkBusy: true, linkMsg: "Reading the product page…" }));
        const d = { url, name: productNameFromUrl(url) };
        try { Object.assign(d, Object.fromEntries(Object.entries(parseProductPage(await fetchPageHtml(url), url)).filter(([, v]) => v != null && v !== ""))); } catch {}
        applyProduct(d, { fromLink: true });
      };
      const pasteProductLink = async () => {
        try { useProductLink(await navigator.clipboard.readText()); }
        catch { setPriceSheet(ps => ({ ...ps, linkMsg: "Your browser blocked reading the clipboard. Long-press the box below and choose Paste." })); }
      };
      useEffect(() => {
        const onMsg = (e) => { if (e.data && e.data.type === "fr-product") applyProduct(e.data); };
        window.addEventListener("message", onMsg);
        return () => window.removeEventListener("message", onMsg);
      }, []);
      // Product sent back by the bookmark via the address bar: apply once the account has loaded
      useEffect(() => { if (appReady && pendingProduct.current) { const d = pendingProduct.current; pendingProduct.current = null; applyProduct(d); } }, [appReady]);
      const appUrl = location.href.split("#")[0];
      const bookmarkletCode = useMemo(() => buildBookmarklet(appUrl), [appUrl]);
      const priceWholeList = async () => {
        const api = (prefs.priceApiUrl || "").trim();
        if (!api) { alert("Automatic pricing needs a price lookup service (Prefs → Store prices). For now, tap “find” on each item - the app remembers your picks for next time."); return; }
        setPricingAll(true);
        const items = groceryItemsAll.filter(it => !offersFor(it.nameKey).some(o => o.price != null));
        let failed = 0;
        for (const it of items) {
          try {
            const best = recommendProduct(it.name, await searchStorePrices(api, currentStore, it.name, prefs.storeZip))[0];
            if (best && best.score > 0) saveStoreMatch(currentStore, it.nameKey, { name: best.name, price: best.price, size: best.size, aisle: best.aisle, url: best.url, auto: true });
          } catch { failed++; }
        }
        setPricingAll(false);
        if (failed) alert(`${failed} item(s) couldn't be priced. Tap "find" on an item to try again or enter it by hand.`);
      };

      const openPhotoSearch = (target, query) => {
        setPhotoTarget(target);
        setPhotoSearchQuery(query || "");
        setPhotoResults([]);
        setPhotoSearchOpen(true);
        if (query) setTimeout(() => searchPhotos(query), 50);
      };

      const searchPhotos = async (q) => {
        const query = (q || photoSearchQuery || "").trim();
        if (!query) return;
        setPhotoLoading(true); setPhotoResults([]);
        const src = typeof photoTarget === "string" ? (recipes.find(r => r.id === photoTarget)?.url || "") : photoTarget === "edit" ? (editForm?.url || "") : (importPreview?.url || "");
        try {
          const cands = await findPhotoCandidates(query, { unsplashKey: (prefs.unsplashAccessKey || "").trim(), sourceUrl: src, limit: 18 });
          setPhotoResults(cands.map(c => ({ url: c.url, thumb: c.thumb, credit: c.credit })));
        } catch { setPhotoResults([]); }
        setPhotoLoading(false);
      };

      const applyPhoto = (url) => {
        if (photoTarget === "edit" && editForm) {
          setEditForm(f => ({ ...f, image: url }));
        } else if (photoTarget === "add") {
          setImportPreview(prev => ({ ...(prev || { title: photoSearchQuery || "Recipe" }), image: url }));
        } else if (photoTarget && typeof photoTarget === "string") {
          setRecipes(prev => prev.map(r => r.id === photoTarget ? { ...r, image: url } : r));
          if (selectedRecipe?.id === photoTarget) {
            setSelectedRecipe(s => ({ ...s, image: url }));
          }
        }
        setPhotoSearchOpen(false);
      };

      const renderRecipeCard = (r, compact = false) => {
        const hasAllergy = recipeHasAllergy(r);
        const hasAvoid = recipeHasAvoid(r);
        const img = r.image || photoUrl(r.title);
        return (
          <div key={r.id} className={`bg-white rounded-2xl shadow-sm border overflow-hidden cursor-pointer hover:shadow-md transition relative ${hasAllergy ? "border-red-400" : hasAvoid ? "border-amber-300" : "border-stone-200"}`}
            onClick={() => { setSelectedRecipe(r); setServingMult(1); setAddToPlannerMode(false); }}>
            {hasAllergy && <div className="absolute top-2 left-2 z-10 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">⚠ ALLERGY</div>}
            {hasAvoid && !hasAllergy && <div className="absolute top-2 left-2 z-10 bg-amber-400 text-stone-900 text-[10px] font-bold px-1.5 py-0.5 rounded">⚠ Avoid</div>}
            <div className={`${compact ? "h-24" : "h-36"} bg-stone-100 relative`}>
              <img src={img} alt="" className="w-full h-full object-cover" onError={(e) => { e.target.onerror = null; e.target.src = photoUrl(r.title); }} />
              {!r.image && (r.imgScan || 0) < PHOTO_SCAN_VERSION && <span className="absolute bottom-2 left-2 bg-white/90 rounded-full px-2 py-0.5 text-[10px] text-cocoa-600 flex items-center gap-1"><Spinner size={9} /> finding photo</span>}

                  <button type="button" onClick={() => {
                    if (!madeRating) { alert("Please select a rating from 1 to 5 stars."); return; }
                    setRecipes(prev => prev.map(r => {
                      if (r.id !== madeThis.id) return r;
                      return {
                        ...r,
                        rating: madeRating,
                        favorite: madeFavorite ? true : r.favorite,
                        timesUsed: (r.timesUsed || 0) + 1
                      };
                    }));
                    setMadeThis(null);
                    setMadeRating(0);
                    setMadeFavorite(false);
                  }} className="flex-1 py-2.5 bg-cocoa-600 text-white rounded-2xl font-medium">Save</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
