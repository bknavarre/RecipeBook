    function getWeekKey(offset = 0) {

      const monday = new Date(d.setDate(diff));

    function compressImage(file, maxSize = 800, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function guessAisle(name, fallback = "Other") {
      const n = (name || "").toLowerCase();
      if (/frozen/.test(n)) return "Frozen";
      if (/black pepper|peppercorn|powder|dried|\bsalt\b|extract/.test(n)) return "Spices & Baking";
      for (const [aisle, re] of AISLE_KEYWORDS) if (re.test(n)) return aisle;
      return fallback;
    }

    const UNICODE_FRAC = { "½": .5, "⅓": 1/3, "⅔": 2/3, "¼": .25, "¾": .75, "⅛": .125, "⅜": .375, "⅝": .625, "⅞": .875 };
    const UNITS = ["cups","cup","c","tablespoons","tablespoon","tbsp","tbs","tbl","teaspoons","teaspoon","tsp","pounds","pound","lbs","lb","ounces","ounce","oz","grams","gram","g","kilograms","kg","ml","milliliters","liters","l","cloves","clove","cans","can","packages","package","pkg","slices","slice","pinch","dash","bunch","stalks","stalk","large","medium","small","quarts","quart","qt","pints","pint","pt","sticks","stick"];
    function parseIngredientLine(line) {
      let text = String(line || "").replace(/\s+/g, " ").trim();
      Object.entries(UNICODE_FRAC).forEach(([k, v]) => { text = text.replace(new RegExp("(\\d)?\\s*" + k), (_, w) => " " + ((w ? Number(w) : 0) + v) + " "); });
      text = text.trim();
      const m = text.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.?\d+)(?:\s*-\s*[\d./]+)?\s+(.*)$/);
      if (!m) return { name: text, amount: 1, unit: "", aisle: guessAisle(text) };
      const toNum = (q) => q.split(/\s+/).reduce((sum, part) => {
        if (part.includes("/")) { const [a, b] = part.split("/").map(Number); return sum + (b ? a / b : 0); }
        return sum + Number(part);
      }, 0);
      const amount = +toNum(m[1]).toFixed(2) || 1;
      let rest = m[2].replace(/^\(.*?\)\s*/, "");
      const firstWord = (rest.split(" ")[0] || "").toLowerCase().replace(/\.$/, "");
      let unit = "";
      if (UNITS.includes(firstWord)) { unit = firstWord; rest = rest.split(" ").slice(1).join(" "); }
      rest = rest.replace(/^of\s+/i, "").trim();
      return { name: rest || text, amount, unit, aisle: /^cans?$/.test(unit) ? "Pantry / Canned" : guessAisle(rest) };
    }

    function splitSteps(text) {
      const clean = String(text || "").split(/\n/).filter(l => !/^\s*(source|notes?):/i.test(l)).join("\n").trim();
      let parts = clean.split(/\n+/).map(s => s.replace(/^\s*(step\s*)?\d+\s*[.):-]\s*/i, "").trim()).filter(Boolean);
      if (parts.length === 1 && parts[0].length > 100) parts = parts[0].split(/(?<=[.!?])\s+(?=[A-Z])/).map(s => s.trim()).filter(Boolean);
      return parts.length ? parts : ["No instructions yet. Tap Edit on the recipe to add them."];
    }

    function CookingMode({ recipe, onClose }) {
      const steps = useMemo(() => splitSteps(recipe.instructions), [recipe.instructions]);
      const [i, setI] = useState(0);
      const [drag, setDrag] = useState(0);
      const [awake, setAwake] = useState(null);
      const startX = useRef(null);
      const startY = useRef(null);
      useEffect(() => {
        let lock = null;
        const request = async () => {
          try {
            if ("wakeLock" in navigator) { lock = await navigator.wakeLock.request("screen"); setAwake(true); }
            else setAwake(false);
          } catch { setAwake(false); }
        };
        request();
        const onVis = () => { if (document.visibilityState === "visible") request(); };
        document.addEventListener("visibilitychange", onVis);
        document.body.style.overflow = "hidden";
        try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch {}
        return () => {
          document.removeEventListener("visibilitychange", onVis);
          if (lock) lock.release().catch(() => {});
          document.body.style.overflow = "";
          try { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); } catch {}
        };
      }, []);
      const go = (n) => setI(x => Math.max(0, Math.min(steps.length - 1, x + n)));
      useEffect(() => {
        const onKey = (e) => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [steps.length]);
      const onTouchStart = (e) => { startX.current = e.touches[0].clientX; startY.current = e.touches[0].clientY; };
      const onTouchMove = (e) => {
        if (startX.current == null) return;
        const dx = e.touches[0].clientX - startX.current;
        const dy = e.touches[0].clientY - startY.current;
        if (Math.abs(dx) > Math.abs(dy)) setDrag(dx);
      };
      const onTouchEnd = () => { if (drag < -60) go(1); else if (drag > 60) go(-1); setDrag(0); startX.current = null; };
      return (
        <div className="fixed inset-0 z-[80] bg-cream-50 flex flex-col select-none">
          <div className="flex items-center justify-between px-5 pt-5 pb-2 gap-3">
            <div className="min-w-0">
              <p className="text-sm text-cocoa-500 truncate font-semibold">{recipe.title}</p>
              <p className={`text-xs ${awake ? "text-emerald-700 font-medium" : "text-stone-400"}`}>{awake ? "☀ Screen locked active" : awake === false ? "Screen wake lock unavailable" : ""}</p>
            </div>
            <button onClick={onClose} className="w-11 h-11 rounded-full bg-white shadow-md text-xl flex-shrink-0 font-bold" aria-label="Close cooking mode">✕</button>
          </div>
          <div className="flex-1 overflow-hidden" onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
            <div className="h-full flex" style={{ width: `${steps.length * 100}%`, transform: `translateX(calc(${-i * (100 / steps.length)}% + ${drag}px))`, transition: drag ? "none" : "transform 280ms ease" }}>
              {steps.map((step, idx) => (
                <div key={idx} className="h-full overflow-y-auto px-6 pb-6 flex flex-col justify-center" style={{ width: `${100 / steps.length}%` }}>
                  <div className="flex items-end gap-2 mb-4">
                    <span className="text-base font-bold uppercase tracking-wider text-cocoa-500 mb-3">Step</span>
                    <span className="font-display font-bold text-cocoa-700 leading-none" style={{ fontSize: "5.5rem" }}>{idx + 1}</span>
                    <span className="text-base text-stone-400 mb-3 font-semibold">of {steps.length}</span>

      const add = (meals) => (meals || []).forEach(m => out.size < 12 && !out.has(m.idMeal) && out.set(m.idMeal, { kind: "mealdb", id: m.idMeal, title: m.strMeal, image: m.strMealThumb + "/medium", site: "TheMealDB" }));
      const words = query.toLowerCase().split(/[,]+|\s+and\s+/).map(s => s.trim()).filter(Boolean);
      const reqs = [fetchWithTimeout(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`, {}, 12000)];
      words.slice(0, 3).forEach(w => reqs.push(fetchWithTimeout(`https://www.themealdb.com/api/json/v1/1/filter.php?i=${encodeURIComponent(w.replace(/\s+/g, "_"))}`, {}, 12000)));
      const res = await Promise.allSettled(reqs);
      for (const r of res) if (r.status === "fulfilled" && r.value.ok) { try { add((await r.value.json()).meals); } catch {} }
      return [...out.values()];
    }
    async function mealDbToRecipe(id) {
      const r = await fetchWithTimeout(`https://www.themealdb.com/api/json/v1/1/lookup.php?i=${id}`, {}, 12000);
      const m = (await r.json()).meals?.[0];
      if (!m) throw new Error("Recipe not found");
      const ings = [];
      for (let i = 1; i <= 20; i++) { const name = (m["strIngredient" + i] || "").trim(); if (name) ings.push(parseIngredientLine(`${(m["strMeasure" + i] || "").trim()} ${name}`.trim())); }
      const steps = String(m.strInstructions || "").split(/\r?\n+/).map(s => s.replace(/^\s*(step\s*)?\d+\s*[.):-]?\s*$/i, "").replace(/^\s*(step\s*)?\d+\s*[.):-]\s*/i, "").trim()).filter(s => s.length > 2);
      const src = m.strSource || `https://www.themealdb.com/meal/${id}`;
      const cat = { Breakfast: "Breakfast", Dessert: "Dessert", Starter: "Snack", Side: "Lunch" }[m.strCategory] || "Dinner";
      return { title: m.strMeal, category: cat, dietTags: m.strCategory === "Vegetarian" || m.strCategory === "Vegan" ? [m.strCategory] : [], baseServings: 4, nutrition: { calories: 400, protein: 25, carbs: 30, fat: 15, fiber: 5 }, ingredients: ings.length ? ings : [{ name: "Ingredient (edit)", amount: 1, unit: "", aisle: "Other" }], instructions: steps.map((s, i) => `${i + 1}. ${s}`).join("\n") + "\n\nSource: " + src, image: m.strMealThumb, url: src };
    }
    async function searchWebRecipes(query) {
      const html = await fetchPageHtml("https://html.duckduckgo.com/html/?q=" + encodeURIComponent(query + " recipe"));
      const results = [];
      const snippets = [...html.matchAll(/class="result__snippet"[^>]*>([\s\S]*?)<\/a>/gi)].map(m => decodeHtml(m[1]));
      [...html.matchAll(/<a[^>]+class="result__a"[^>]+href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi)].forEach((m, i) => {
        let href = m[1].replace(/&amp;/g, "&");
        const uddg = href.match(/[?&]uddg=([^&]+)/);
        if (uddg) href = decodeURIComponent(uddg[1]);
        if (href.startsWith("//")) href = "https:" + href;
        if (!/^https?:/.test(href) || /duckduckgo\.com\/y\.js|ad_provider|bing\.com\/aclick/.test(href)) return;
        let site = ""; try { site = new URL(href).hostname.replace(/^www\./, ""); } catch {}
        if (results.length < 10) results.push({ kind: "web", title: decodeHtml(m[2]), url: href, snippet: snippets[i] || "", site });
      });
      return results;
    }

    // ========== ACCOUNTS (Firebase Authentication + Cloud Firestore) ==========
    const FB_SOURCES = ["https://www.gstatic.com/firebasejs/13.1.0/", "https://cdnjs.cloudflare.com/ajax/libs/firebase/13.0.0/"];
    let fbPromise = null;
    let signupInProgress = false;
    function initFirebase() {
      if (!FIREBASE_CONFIG) return Promise.reject(new Error("Accounts aren't set up in this copy of the app."));
      if (fbPromise) return fbPromise;
      fbPromise = (async () => {
        let lastErr;
        for (const base of FB_SOURCES) {
          try {
            await loadScriptOnce(base + "firebase-app-compat.js");
            await loadScriptOnce(base + "firebase-auth-compat.js");
            await loadScriptOnce(base + "firebase-firestore-compat.js");
            lastErr = null; break;
          } catch (e) { lastErr = e; }
        }
        if (lastErr || !window.firebase) throw new Error("Couldn't reach the sign-in service. Check your internet connection.");
        const firebase = window.firebase;
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
        const db = app.firestore();
        try { db.settings({ ignoreUndefinedProperties: true, merge: true }); } catch {}
        return { firebase, auth: app.auth(), db };
      })();
      fbPromise.catch(() => { fbPromise = null; });
      return fbPromise;
    }
    const USERNAME_RE = /^[a-z0-9_.]{3,20}$/;
    function friendlyAuthError(e) {
      const c = e?.code || "";
      const map = {
        "auth/email-already-in-use": "There's already an account with that email. Try logging in instead.",
        "auth/invalid-email": "That email address doesn't look right.",
        "auth/weak-password": "Please choose a stronger password (at least 8 characters).",
        "auth/wrong-password": "Wrong password. Try again or tap “Forgot password?”.",
        "auth/invalid-credential": "Wrong username/email or password.",
        "auth/invalid-login-credentials": "Wrong username/email or password.",
        "auth/user-not-found": "No account found with that email.",
        "auth/too-many-requests": "Too many tries. Please wait a few minutes and try again.",
        "auth/network-request-failed": "Network problem - check your internet connection.",
        "auth/operation-not-allowed": "Email sign-in isn't turned on yet (Firebase → Authentication → Sign-in method → Email/Password).",
        "permission-denied": "The database blocked this. Make sure the security rules from SETUP.md are published."
      };
      return map[c] || e?.message || "Something went wrong. Please try again.";
    }
    async function emailForLogin(id) {
      const v = String(id || "").trim();
      if (v.includes("@")) return v;
      const { db } = await initFirebase();
      const snap = await db.collection("usernames").doc(v.toLowerCase()).get();
      if (!snap.exists) throw new Error("No account with that username.");
      return snap.data().email;
    }
    async function accountSignUp({ username, email, password }) {
      const u = String(username || "").trim().toLowerCase();
      if (!USERNAME_RE.test(u)) throw new Error("Usernames are 3-20 characters: letters, numbers, _ or .");
      if (String(password || "").length < 8) throw new Error("Passwords need at least 8 characters.");
      const { auth, db, firebase } = await initFirebase();
      if ((await db.collection("usernames").doc(u).get()).exists) throw new Error("That username is taken. Please pick another.");
      signupInProgress = true;
      try {
        const cred = await auth.createUserWithEmailAndPassword(String(email).trim(), password);
        const uidNow = cred.user.uid;
        try {
          await db.runTransaction(async (tx) => {
            const ref = db.collection("usernames").doc(u);
            if ((await tx.get(ref)).exists) throw new Error("taken");
            tx.set(ref, { uid: uidNow, email: String(email).trim().toLowerCase() });
            tx.set(db.collection("users").doc(uidNow), { username: u, email: String(email).trim().toLowerCase(), plan: "trial", trialStarted: firebase.firestore.FieldValue.serverTimestamp(), createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          });
        } catch (e) {
          await cred.user.delete().catch(() => {});
          throw e.message === "taken" ? new Error("That username was just taken. Please pick another.") : e;
        }
        return cred.user;
      } finally { signupInProgress = false; }
    }
    async function accountLogIn({ id, password }) {
      const { auth } = await initFirebase();
      await auth.signInWithEmailAndPassword(await emailForLogin(id), password);
    }
    async function accountReset(id) {
      const { auth } = await initFirebase();
      await auth.sendPasswordResetEmail(await emailForLogin(id));
    }
    async function cloudLoad(uidNow) {
      const { db } = await initFirebase();
      const userRef = db.collection("users").doc(uidNow);
      const [profileSnap, stateSnap, recipeSnap] = await Promise.all([userRef.get(), userRef.collection("data").doc("state").get(), userRef.collection("recipes").get()]);
      const recipes = [];
      recipeSnap.forEach(d => { try { recipes.push(JSON.parse(d.data().json)); } catch {} });
      return { profile: profileSnap.exists ? profileSnap.data() : null, stateJson: stateSnap.exists ? stateSnap.data().json : "", recipes };
    }
    async function cloudWriteState(uidNow, json) {
      const { db, firebase } = await initFirebase();
      if (json.length > 950000) throw new Error("Your planner data is too large to save. Clear old weeks.");

    async function cloudWriteRecipes(uidNow, ops) {
      const { db } = await initFirebase();
      const col = db.collection("users").doc(uidNow).collection("recipes");
      for (let i = 0; i < ops.length; i += 400) {
        const batch = db.batch();
        ops.slice(i, i + 400).forEach(op => op.del ? batch.delete(col.doc(op.id)) : batch.set(col.doc(op.id), { json: op.json }));
        await batch.commit();
      }

    // ========== PASTED RECIPE IMPORT ==========
    function parsePastedRecipeText(rawText, sourceLabel = "") {
      const text = String(rawText || "").replace(/\r/g, "").replace(/\u00a0/g, " ").trim();
      if (!text) throw new Error("Paste a recipe first.");
      const lines = text.split("\n").map(l => l.replace(/^\s*[•●▪◦*-]\s*/, "").trim());
      const nonEmpty = lines.filter(Boolean);
      const heading = (line) => String(line || "").replace(/[:：]\s*$/, "").trim().toLowerCase();
      const isIngredientHeading = l => /^(ingredients?|what you(?:'|’)ll need|you will need|for the (?:sauce|filling|dough|topping|marinade|chicken|meat|vegetables?))$/i.test(heading(l));
      const isInstructionHeading = l => /^(instructions?|directions?|method|preparation|steps?|how to make(?: it)?)$/i.test(heading(l));
      const isNutritionHeading = l => /^(nutrition|nutrition facts|nutritional information|nutrition per serving)$/i.test(heading(l));
      const isNotesHeading = l => /^(notes?|tips?)$/i.test(heading(l));
      let ingStart = lines.findIndex(isIngredientHeading);
      let stepStart = lines.findIndex(isInstructionHeading);
      let nutStart = lines.findIndex(isNutritionHeading);
      let notesStart = lines.findIndex(isNotesHeading);
      const sectionEnds = (start) => [ingStart, stepStart, nutStart, notesStart].filter(x => x > start).sort((a,b) => a-b)[0] ?? lines.length;

      let title = nonEmpty.find(l => !isIngredientHeading(l) && !isInstructionHeading(l) && !isNutritionHeading(l) && !/^(serves|servings|yield|makes)\b/i.test(l)) || "Pasted Recipe";
      title = title.replace(/^#+\s*/, "").replace(/\s*recipe\s*$/i, "").trim() || "Pasted Recipe";
      const servesMatch = text.match(/(?:serves?|servings?|yield|makes)\s*:?\s*(\d{1,3})/i);
      const baseServings = servesMatch ? Number(servesMatch[1]) : 4;
      const servingsEstimated = !servesMatch;

      let ingredientLines = [];
      if (ingStart >= 0) ingredientLines = lines.slice(ingStart + 1, sectionEnds(ingStart)).filter(Boolean);
      if (!ingredientLines.length && stepStart > 0) {
        ingredientLines = lines.slice(1, stepStart).filter(l => !/^(serves|servings|yield|makes)\b/i.test(l));
      }
      ingredientLines = ingredientLines.filter(l => !isIngredientHeading(l) && !isInstructionHeading(l) && l.length < 180);
      const ingredients = ingredientLines.slice(0, 50).map(line => {
        const cleaned = line.replace(/^\s*\d+[.)]\s*/, "").trim();
        const parsed = parseIngredientLine(cleaned);
        if (/\bto taste\b/i.test(cleaned)) parsed.unit = "to taste";
        return parsed;
      }).filter(i => i.name);

      let stepLines = [];
      if (stepStart >= 0) stepLines = lines.slice(stepStart + 1, sectionEnds(stepStart)).filter(Boolean);
      if (!stepLines.length) {
        stepLines = nonEmpty.filter(l => /^\s*(?:step\s*)?\d+[.)-]\s+/.test(l));
      }
      stepLines = stepLines.map(l => l.replace(/^\s*(?:step\s*)?\d+[.)-]\s*/i, "").trim()).filter(Boolean);
      if (stepLines.length === 1 && stepLines[0].length > 180) {
        stepLines = stepLines[0].split(/(?<=[.!?])\s+(?=[A-Z])/).filter(Boolean);
      }
      const instructions = stepLines.length ? stepLines.map((x, i) => `${i + 1}. ${x}`).join("\n") : "";

      const nutrition = { calories: 0, protein: 0, carbs: 0, fat: 0, fiber: 0 };
      const nutritionPatterns = {
        calories: /calories?\s*:?\s*(\d+(?:\.\d+)?)/i,
        protein: /protein\s*:?\s*(\d+(?:\.\d+)?)\s*g?/i,
        carbs: /(?:carbohydrates?|carbs)\s*:?\s*(\d+(?:\.\d+)?)\s*g?/i,
        fat: /(?:total\s+)?fat\s*:?\s*(\d+(?:\.\d+)?)\s*g?/i,
        fiber: /fib(?:er|re)\s*:?\s*(\d+(?:\.\d+)?)\s*g?/i
      };
      Object.entries(nutritionPatterns).forEach(([k,re]) => { const m=text.match(re); if(m) nutrition[k]=Number(m[1]); });
      const nutritionProvided = Object.values(nutrition).some(v => v > 0);
      const category = /breakfast|brunch|pancake|waffle|omelet/i.test(title) ? "Breakfast" : /dessert|cake|cookie|pie|brownie/i.test(title) ? "Dessert" : /lunch|sandwich|salad/i.test(title) ? "Lunch" : "Dinner";
      const confidence = (title !== "Pasted Recipe" ? 0.2 : 0) + (ingredients.length >= 2 ? 0.4 : 0) + (stepLines.length >= 1 ? 0.3 : 0) + (servesMatch ? 0.1 : 0);
      return {
        title, category, dietTags: [], baseServings, servingsEstimated,
        nutrition, nutritionProvided,
        ingredients: ingredients.length ? ingredients : [{ name: "Ingredient (edit)", amount: 1, unit: "", aisle: "Other" }],
        instructions: instructions || "Add instructions.", image: null, url: "",
        source: { type: "pasted", label: sourceLabel.trim() },
        pasteConfidence: confidence
      };
    }

            if (r.favorite) score += 40;
            score += (r.timesUsed || 0) * 2;
            (r.ingredients || []).forEach(i => {
              if (favIngs.some(f => i.name.toLowerCase().includes(f))) score += 15;
              if (avoid.some(a => i.name.toLowerCase().includes(a))) score -= 25;
            });
            if (priority === "protein") score += (r.nutrition?.protein || 0) * 0.8;
            else if (priority === "fiber") score += (r.nutrition?.fiber || 0) * 3;
            else if (priority === "low-carb") score += Math.max(0, 40 - (r.nutrition?.carbs || 0));

            if (cal > target * 1.4) score -= 15;

        // Consistent community-pooled price estimator
        let hash = 0;
        for (let i = 0; i < itemKey.length; i++) hash = (hash << 5) - hash + itemKey.charCodeAt(i);

                        </div>
                      );
                    })}
                  </>
                )}
                {removedThisWeek.length > 0 && <button onClick={() => setGroceryRemoved(r => r.filter(k => !k.startsWith(currentWeekKey + "|")))} className="text-xs font-bold text-cocoa-600 underline">Restore removed items ({removedThisWeek.length})</button>}
              </div>
            )}

            {tab === "discover" && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl border border-cocoa-100 p-5 space-y-3 shadow-recipeak">
                  <h3 className="font-display text-2xl font-bold text-cocoa-800">What do you have?</h3>
                  <textarea value={discoverIngredients} onChange={e => setDiscoverIngredients(e.target.value)}
                    placeholder="chicken, broccoli, rice, garlic..." rows={2}
                    className="w-full px-4 py-3 rounded-2xl border border-cocoa-200 text-sm focus:outline-none focus:ring-2 focus:ring-cocoa-400 bg-cream-50 font-medium" />
                  <select value={discoverFilter} onChange={e => setDiscoverFilter(e.target.value)} className="w-full px-4 py-3 rounded-2xl border border-cocoa-200 text-sm font-semibold bg-white">
                    <option value="">Any style</option>
                    <option value="High-Protein">High-Protein</option>
                    <option value="Low-Calorie">Low-Calorie</option>
                    <option value="Heart-Healthy">Heart-Healthy</option>
                    <option value="Keto">Keto</option>
                    <option value="Crockpot">Crockpot / Slow cooker</option>
                  </select>
                  <button onClick={runDiscover} className="w-full py-3.5 bg-cocoa-600 text-white rounded-2xl font-bold shadow-md">Search my recipes</button>
                  <button onClick={runWebSearch} disabled={webLoading} className="w-full py-3.5 bg-white border border-cocoa-200 text-cocoa-800 rounded-2xl font-bold shadow-sm flex items-center justify-center gap-2 disabled:opacity-70">
                    {webLoading ? <><Spinner size={16} /> Searching the web…</> : "🌐 Search the web"}
                  </button>
                </div>

                <div className="bg-white rounded-3xl border border-cocoa-100 p-5 space-y-3 shadow-recipeak">
                  <h3 className="font-display text-2xl font-bold text-cocoa-800">AI Chef</h3>
                  <p className="text-xs text-stone-500 font-semibold leading-relaxed">Creates a full recipe using your specific ingredients and dietary restrictions via Gemini AI.</p>
                  <button onClick={generateAiRecipe} disabled={aiLoading}
                    className="w-full py-3.5 bg-gradient-to-r from-cocoa-500 to-cocoa-600 text-white rounded-2xl font-bold shadow-md disabled:opacity-60">
                    {aiLoading ? <span className="inline-flex items-center gap-2"><Spinner size={18} /> Creating recipe…</span> : "✨ Generate with AI Chef"}
                  </button>
                </div>

                {discoverResults.length > 0 && (
                  <div>
                    <h3 className="font-bold text-base text-cocoa-800 mb-2 px-1">From your library</h3>
                    <div className="grid grid-cols-2 gap-3">
                      {discoverResults.map(r => renderRecipeCard(r))}
                    </div>
                  </div>
                )}
              </div>
            )}

                        {tab === "prefs" && (
              <div className="space-y-5">
                {/* Account & Preferences Accordion */}
                <div className="bg-white rounded-3xl border border-cocoa-100 p-5 space-y-4 shadow-recipeak">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-base text-cocoa-800">Account & Profile</h3>
                      {account.status === "in" ? (
                        <p className="text-xs text-stone-500 font-semibold mt-0.5">Signed in as <b className="text-cocoa-700">@{account.username}</b> ({account.email})</p>
                      ) : (
                        <p className="text-xs text-stone-500 font-semibold mt-0.5">Using locally on this device</p>
                      )}
                    </div>
                    <button onClick={() => setAccountDetailsOpen(!accountDetailsOpen)} className="px-3.5 py-1.5 rounded-xl bg-cocoa-50 text-cocoa-700 text-xs font-extrabold border border-cocoa-200 shadow-sm flex items-center gap-1">
                      {accountDetailsOpen ? "Hide Settings ▲" : "Manage Settings ▼"}
                    </button>
                  </div>

                  {accountDetailsOpen && (
                    <div className="pt-3 border-t border-stone-100 space-y-5 animate-fadeIn">
                      {/* Dietary Dislikes & Allergies */}
                      <div className="space-y-3">
                        <h4 className="text-xs font-extrabold uppercase tracking-wider text-cocoa-600">Dietary Dislikes & Allergies</h4>
                        <div>
                          <label className="block text-xs font-bold text-amber-800 mb-1">🚫 Disliked Foods / Ingredients</label>
                          <div className="flex flex-wrap gap-1.5 mb-2">
                            {(prefs.avoidIngredients || []).map(item => (
                              <span key={item} className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-900 border border-amber-200">
                                🚫 {item}
                                <button onClick={() => setPrefs(p => ({ ...p, avoidIngredients: p.avoidIngredients.filter(x => x !== item) }))} className="hover:text-red-700 font-black ml-0.5">✕</button>
                              </span>
                            ))}
                          </div>
                          <div className="flex gap-2">
                            <input value={newDislikeInput} onChange={e => setNewDislikeInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addDislike(); } }} placeholder="Add disliked ingredient (e.g. mushrooms)..." className="flex-1 px-3.5 py-2 rounded-xl border border-stone-200 text-xs font-semibold bg-cream-50" />
                            <button onClick={addDislike} className="px-3.5 py-2 bg-amber-600 text-white text-xs font-bold rounded-xl shadow-sm">Add</button>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-red-800 mb-1">⚠️ Severe Allergies</label>
                          <div className="flex flex-wrap gap-1.5 mb-2">
                            {(prefs.allergies || []).map(item => (
                              <span key={item} className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-900 border border-red-200">
                                ⚠️ {item}
                                <button onClick={() => setPrefs(p => ({ ...p, allergies: p.allergies.filter(x => x !== item) }))} className="hover:text-red-900 font-black ml-0.5">✕</button>
                              </span>
                            ))}
                          </div>
                          <div className="flex gap-2">
                            <input value={newAllergyInput} onChange={e => setNewAllergyInput(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); addAllergy(); } }} placeholder="Add severe allergy (e.g. peanuts, shellfish)..." className="flex-1 px-3.5 py-2 rounded-xl border border-stone-200 text-xs font-semibold bg-cream-50" />
                            <button onClick={addAllergy} className="px-3.5 py-2 bg-red-600 text-white text-xs font-bold rounded-xl shadow-sm">Add</button>
                          </div>
                        </div>
                      </div>

                      {/* Weekly Budget Changer Slider */}
                      <div className="pt-2 border-t border-stone-100 space-y-2">
                        <div className="flex justify-between items-center">
                          <label className="text-xs font-extrabold uppercase tracking-wider text-cocoa-600">Weekly Grocery Budget</label>
                          <span className="text-base font-black text-emerald-800">${prefs.weeklyBudget || 120} / wk</span>
                        </div>
                        <input type="range" min="50" max="500" step="10" value={prefs.weeklyBudget || 120} onChange={e => setPrefs(p => ({ ...p, weeklyBudget: e.target.value }))} className="w-full accent-cocoa-600 h-2 bg-stone-200 rounded-lg cursor-pointer" />
                        <div className="flex justify-between text-[10px] text-stone-400 font-bold">
                          <span>$50</span>
                          <span>$250</span>
                          <span>$500+</span>
                        </div>
                      </div>

                      {/* Account Actions */}
                      <div className="pt-2 border-t border-stone-100">
                        {account.status === "in" ? (
                          <button onClick={logOut} className="w-full py-2.5 rounded-2xl bg-stone-100 text-xs font-bold text-stone-700 hover:bg-stone-200 transition">Log out</button>
                        ) : (
                          FIREBASE_CONFIG && <button onClick={() => { localStorage.removeItem("fr_mode"); location.reload(); }} className="w-full py-3 rounded-2xl bg-cocoa-600 text-white text-xs font-bold shadow-md">Log in or create an account</button>
                        )}
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-white rounded-3xl border border-cocoa-100 p-5 space-y-3 shadow-recipeak">
                  <h3 className="font-bold text-base text-cocoa-800">Family & Targets</h3>
                  <label className="block text-sm font-bold text-stone-700">Family Name
                    <input type="text" value={prefs.familyName || ""} placeholder="e.g. Smith"
                      onChange={e => setPrefs(p => ({ ...p, familyName: e.target.value }))}
                      className="mt-1 w-full px-4 py-2.5 rounded-2xl border border-cocoa-200 bg-cream-50 font-semibold text-sm" />
                  </label>
                  <label className="block text-sm font-bold text-stone-700">Family size
                    <input type="number" min="1" value={prefs.familySize} onChange={e => setPrefs(p => ({ ...p, familySize: Number(e.target.value) || 1 }))} className="mt-1 w-full px-4 py-2.5 rounded-2xl border border-cocoa-200 bg-cream-50 font-bold text-sm" />
                  </label>
                  <label className="block text-sm font-bold text-stone-700">Daily calorie target (per person)
                    <input type="number" value={prefs.calorieTarget} onChange={e => setPrefs(p => ({ ...p, calorieTarget: Number(e.target.value) || 2000 }))} className="mt-1 w-full px-4 py-2.5 rounded-2xl border border-cocoa-200 bg-cream-50 font-bold text-sm" />
                  </label>
                </div>

                <div className="bg-white rounded-3xl border border-cocoa-100 p-5 space-y-3 shadow-recipeak">
                  <h3 className="font-bold text-base text-cocoa-800">AI & Photo Keys</h3>
                  <label className="block text-sm font-bold text-stone-700">Gemini API Key
                    <input type="password" value={prefs.geminiApiKey || ""} placeholder="AIza..."
                      onChange={e => setPrefs(p => ({ ...p, geminiApiKey: e.target.value }))}
                      className="mt-1 w-full px-4 py-2.5 rounded-2xl border border-cocoa-200 bg-cream-50 font-mono text-xs" />
                  </label>
                  <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer" className="text-xs font-bold text-cocoa-600 underline">Get free Gemini key →</a>
                </div>

                <button onClick={() => { if (confirm("Reset all data?")) { localStorage.clear(); window.location.reload(); } }}
                  className="w-full py-3 text-sm font-bold text-red-600 border border-red-200 rounded-2xl bg-white">Reset all data</button>
              </div>
            )}
          </main>

          {/* BOTTOM NAVIGATION BAR */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white/95 backdrop-blur-md border-t border-cocoa-100 flex justify-around py-2.5 rounded-t-3xl shadow-[0_-4px_25px_rgba(0,0,0,0.06)]">
            {[
              { id: "recipes", label: "Recipes" },
              { id: "planner", label: "Planner" },
              { id: "grocery", label: "Grocery" },
              { id: "pantry", label: "Pantry" },
              { id: "discover", label: "Discover" },
              { id: "prefs", label: "Prefs" }
            ].map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-2xl text-[11px] font-bold transition-all ${tab === t.id ? "bg-cocoa-600 text-white shadow-sm" : "text-stone-400 hover:text-stone-600"}`}>
                <TabIcon name={t.id} />{t.label}
              </button>
            ))}
          </nav>

          {/* RECIPE DETAIL MODAL */}
          {selectedRecipe && (() => {
            const r = recipes.find(x => x.id === selectedRecipe.id) || selectedRecipe;
            const mult = servingMult;
            const nut = getScaledNutrition(r, mult);
            const ings = getScaledIngredients(r, mult);
            const img = r.image || photoUrl(r.title);

            return (
              <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
                <div className="bg-white w-full max-w-lg max-h-[92vh] rounded-t-[2.5rem] sm:rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl">
                  <div className="relative h-56 bg-stone-100 flex-shrink-0">
                    <img src={img} className="w-full h-full object-cover" onError={(e) => { e.target.onerror=null; e.target.src=photoUrl(""); }} />
                    <button onClick={() => { setSelectedRecipe(null); setAddToPlannerMode(false); setEditingRecipe(false); }} className="absolute top-4 right-4 w-10 h-10 bg-white/90 backdrop-blur-sm rounded-full flex items-center justify-center shadow-md font-bold text-lg">✕</button>
                    <div className="absolute top-4 left-4 flex gap-2">
                      <button onClick={() => setCookingRecipe(r)} className="px-4 py-2 bg-cocoa-600 text-white rounded-full text-xs font-extrabold shadow-md">👩‍🍳 Cooking mode</button>
                    </div>
                  </div>
                  <div className="p-5 overflow-y-auto flex-1 space-y-4">
                    <div className="flex justify-between items-start gap-2">
                      <h2 className="text-2xl font-bold leading-tight text-stone-800">{r.title}</h2>
                      <button onClick={() => toggleFavorite(r.id)} className="text-3xl leading-none">{r.favorite ? "♥" : "♡"}</button>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-xs font-bold text-stone-500">Servings:</span>
                      {[0.5,1,2,3].map(m => <button key={m} onClick={() => setServingMult(m)} className={`px-3 py-1 rounded-full text-xs font-bold ${mult === m ? "bg-cocoa-600 text-white" : "bg-stone-100 text-stone-700"}`}>{m === 0.5 ? "½×" : m + "×"}</button>)}
                    </div>
                    <div className="grid grid-cols-5 gap-2 text-center">
                      {[["Cal", nut.calories], ["Protein", nut.protein+"g"], ["Carbs", nut.carbs+"g"], ["Fat", nut.fat+"g"], ["Fiber", nut.fiber+"g"]].map(([l,v]) => (
                        <div key={l} className="bg-cream-100 rounded-2xl py-2.5"><div className="text-sm font-extrabold text-cocoa-800">{v}</div><div className="text-[10px] font-bold text-stone-400 uppercase">{l}</div></div>
                      ))}
                    </div>
                    <h3 className="font-bold text-base text-cocoa-800">Ingredients</h3>
                    <ul className="space-y-2 text-sm font-medium">{ings.map((ing,i) => <li key={i} className="flex justify-between border-b border-stone-100 pb-1.5"><span className="text-stone-800">{ing.name}</span><span className="text-stone-500 font-bold">{ing.amount} {ing.unit}</span></li>)}</ul>
                    <h3 className="font-bold text-base text-cocoa-800 pt-2">Instructions</h3>
                    <pre className="text-sm whitespace-pre-wrap font-sans text-stone-700 leading-relaxed font-medium">{r.instructions}</pre>
                    <button onClick={() => deleteRecipe(r.id)} className="w-full mt-4 py-2 text-xs font-bold text-red-500">Delete recipe</button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* SETUP MODAL TRIGGER */}
          {appReady && !prefs.onboarded && <MultiStepOnboarding prefs={prefs} setPrefs={setPrefs} onComplete={() => setTab("grocery")} />}

          {/* AUTH SCREEN */}
          {!appReady && (
            account.status === "loading" || account.status === "syncing"
              ? <div className="fixed inset-0 z-[100] bg-cream-50 flex flex-col items-center justify-center gap-3 text-cocoa-600"><Spinner size={40} className="border-4" /><p className="text-sm font-semibold">{account.status === "syncing" ? "Loading your recipes…" : "Starting up…"}</p></div>
              : <AuthScreen configured={!!FIREBASE_CONFIG} loadError={!!account.loadError} errorMessage={account.status === "error" ? account.message : ""}
                  onLocal={() => { localStorage.setItem("fr_mode", "local"); setAccount({ status: "local" }); }}
                  onSignedUp={(user) => handleSignedIn(user, { isNew: true })}
                  onRetry={() => location.reload()} />
          )}

          {cookingRecipe && <CookingMode recipe={cookingRecipe} onClose={() => setCookingRecipe(null)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
